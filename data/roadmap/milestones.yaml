# ─── Released — 2019–2020 ─────────────────────────────────────────────────────

- id: parsley
  title: "Parsley (OpenFF 1.0)"
  codename: "Parsley"
  status: released
  category: force-field
  date: "2020-01-15"
  description: >
    First generation of optimised OpenFF small molecule force fields,
    refit from smirnoff99Frosst against large QM datasets using ForceBalance.
    Introduced systematic parameter optimisation for the OpenFF Initiative.
  github: "https://github.com/openforcefield/openff-forcefields/releases/tag/1.0.0"
  doi: "https://zenodo.org/record/3483227"

- id: openff-toolkit
  title: "OpenFF Toolkit"
  status: released
  category: infrastructure
  date: "2019-01-01"
  description: >
    Open-source Python toolkit for applying SMIRNOFF force fields to
    molecular systems. Supports RDKit and OpenEye backends with
    direct chemical perception via SMARTS-based typing.
  github: "https://github.com/openforcefield/openff-toolkit"

- id: smirnoff99frosst
  title: "smirnoff99Frosst"
  status: released
  category: force-field
  date: "2019-01-01"
  description: >
    Minimalist AMBER-compatible general small molecule force field using
    SMIRNOFF direct chemical perception. Comparable accuracy to GAFF with
    far fewer parameters; served as the starting point for Parsley.
  github: "https://github.com/openforcefield/smirnoff99Frosst"
  doi: "https://doi.org/10.5281/zenodo.3351714"
