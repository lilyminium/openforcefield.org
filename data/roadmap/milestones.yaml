# Roadmap milestones — single source of truth for the Research/Roadmap page.
#
# STATUS VALUES:
#   current   — in active development
#   released  — shipped (add `date` in YYYY-MM-DD)
#   planned   — on the roadmap but not yet started
#
# AUTO-UPDATING TIPS:
#   • When a "current" project ships, change status → released, add date, add github/doi links.
#   • The force-fields page (/force-fields/force-fields/) auto-updates from GitHub releases —
#     no manual edits needed there.
#   • To surface the latest release automatically here, use the `latest-ff` shortcode
#     in the milestone's detail page.
#
# CATEGORY VALUES: force-field | infrastructure | method | data

# ─── In Progress ──────────────────────────────────────────────────────────────

- id: protein-force-field
  title: "Protein force field"
  status: current
  category: force-field
  target: "2026"
  description: >
    Development of a comprehensive SMIRNOFF-compatible protein force field,
    targeting consistent treatment of standard and non-standard amino acids
    alongside existing small molecule parameters.

- id: sage-2-4-0
  title: "Sage 2.4.0"
  codename: "Sage"
  status: current
  category: force-field
  target: "2025"
  description: >
    Next Sage minor release with continued improvements to valence and
    non-bonded parameters, building on the Sage 2.3.0 training pipeline.

- id: water-model
  title: "Water model co-optimization"
  status: current
  category: force-field
  target: "2026"
  description: >
    Co-optimization of a water model jointly with OpenFF small molecule
    parameters to improve accuracy of solvation and binding free energies.

- id: virtual-sites
  title: "Virtual sites"
  status: current
  category: force-field
  target: "2026"
  description: >
    Prototype force field with virtual sites to capture anisotropic charge
    distributions (halogens, lone pairs), improving electrostatic accuracy
    without adding atomic mass.

- id: nn-charges-v2
  title: "Neural network charges v2"
  status: current
  category: method
  target: "2025"
  description: >
    Second-generation neural network charge model building on AshGC,
    targeting broader chemical coverage and improved accuracy for
    challenging functional groups.

